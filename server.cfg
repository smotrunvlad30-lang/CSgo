// Настройки защиты от флуда запросами к движку (Source Engine Query Floods)
// Ограничиваем количество запросов в секунду
sv_max_queries_sec 3
sv_max_queries_window 10
sv_max_queries_sec_global 60

// Сетевые настройки для оптимизации трафика
sv_mincmdrate 64
sv_minupdaterate 64
sv_maxcmdrate 128
sv_maxupdaterate 128

// Защита от спама в логах
sv_logecho 0
sv_logfile 1
sv_log_onefile 0
